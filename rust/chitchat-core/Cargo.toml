[package]
name = "chitchat-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }

# RFC 9420 MLS protocol implementation and RustCrypto provider.
openmls = { version = "=0.9.2", features = ["openmls_rust_crypto"] }
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"

# Authenticated media encryption primitives.
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2.17"
sha2 = "0.10"
zeroize = "1.8"
