plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'in.skmohammadali.chitchat'
version = '0.1.0'
android {
  namespace "in.skmohammadali.chitchat"
  defaultConfig {
    minSdkVersion 24
    consumerProguardFiles "consumer-rules.pro"
  }
}
dependencies {
  implementation project(':expo-modules-core')
}
def rustRoot = rootProject.projectDir.parentFile.parentFile
tasks.register("buildChitChatRustAndroid", Exec) {
  workingDir rustRoot
  commandLine "bash", "scripts/build-rust-android.sh"
}
tasks.named("preBuild").configure { dependsOn("buildChitChatRustAndroid") }
